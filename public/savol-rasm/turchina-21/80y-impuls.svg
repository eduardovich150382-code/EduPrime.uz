<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200" font-family="Arial, Helvetica, sans-serif"><title>Alfa-yemirilishda impuls va energiyaning taqsimlanishi</title><style>.h{paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round}text{fill:#111827}</style><defs><marker id="aEA580C" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#EA580C"/></marker><marker id="a2563EB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563EB"/></marker></defs><rect width="440" height="200" fill="#fff"/><line x1="210" y1="70" x2="70" y2="70" stroke="#EA580C" stroke-width="5" stroke-linecap="round" marker-end="url(#aEA580C)"/><text x="140" y="70" font-size="16" text-anchor="middle" font-weight="bold" class="h" style="fill:#EA580C"></text><line x1="230" y1="70" x2="370" y2="70" stroke="#2563EB" stroke-width="5" stroke-linecap="round" marker-end="url(#a2563EB)"/><text x="300" y="70" font-size="16" text-anchor="middle" font-weight="bold" class="h" style="fill:#2563EB"></text><circle cx="220" cy="70" r="6" fill="#111827" stroke="#111827" stroke-width="1"/><text x="140" y="52" font-size="16" text-anchor="middle" font-weight="bold" class="h" style="fill:#EA580C"><tspan font-style="italic">p</tspan><tspan dy="4" font-size="11">Pb</tspan><tspan dy="-4"> </tspan></text><text x="300" y="52" font-size="16" text-anchor="middle" font-weight="bold" class="h" style="fill:#2563EB"><tspan font-style="italic">p</tspan><tspan dy="4" font-size="11">α</tspan><tspan dy="-4"> </tspan></text><text x="220" y="125" font-size="16" text-anchor="middle" font-weight="bold" class="h"><tspan font-style="italic">p</tspan><tspan dy="4" font-size="11">Pb</tspan><tspan dy="-4"> </tspan> = <tspan font-style="italic">p</tspan><tspan dy="4" font-size="11">α</tspan><tspan dy="-4"> </tspan>  ⇒  <tspan font-style="italic">E</tspan><tspan dy="4" font-size="11">Pb</tspan><tspan dy="-4"> </tspan>/<tspan font-style="italic">E</tspan><tspan dy="4" font-size="11">α</tspan><tspan dy="-4"> </tspan> = <tspan font-style="italic">m</tspan><tspan dy="4" font-size="11">α</tspan><tspan dy="-4"> </tspan>/<tspan font-style="italic">m</tspan><tspan dy="4" font-size="11">Pb</tspan><tspan dy="-4"> </tspan></text><text x="220" y="165" font-size="16" text-anchor="middle" font-weight="bold" class="h" style="fill:#EA580C">η = <tspan font-style="italic">m</tspan><tspan dy="4" font-size="11">α</tspan><tspan dy="-4"> </tspan>/(<tspan font-style="italic">m</tspan><tspan dy="4" font-size="11">α</tspan><tspan dy="-4"> </tspan> + <tspan font-style="italic">m</tspan><tspan dy="4" font-size="11">Pb</tspan><tspan dy="-4"> </tspan>) ≈ 0,019</text></svg>