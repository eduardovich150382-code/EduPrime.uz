<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" width="420" height="190" font-family="Arial, Helvetica, sans-serif"><title>Pu-239 yadrosi tarkibi: A = Z + N</title><style>.h{paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round}text{fill:#111827}</style><defs></defs><rect width="420" height="190" fill="#fff"/><rect x="40" y="50" width="126.9" height="34" rx="5" fill="#FCA5A5" stroke="#DC2626" stroke-width="2.5"/><text x="103.5" y="72" font-size="14" text-anchor="middle">Z = 94 proton</text><rect x="166.9" y="50" width="195.8" height="34" rx="5" fill="#CBD5E1" stroke="#64748B" stroke-width="2.5"/><text x="264.8" y="72" font-size="14" text-anchor="middle">N = 145 neytron</text><path d="M40,100 v10 H362.65000000000003 v-10" stroke="#334155" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="201.3" y="135" font-size="17" text-anchor="middle" font-weight="bold" class="h" style="fill:#EA580C"><tspan font-style="italic">A</tspan> = <tspan font-style="italic">Z</tspan> + <tspan font-style="italic">N</tspan> = 239 nuklon</text><text x="207.4" y="21.4" font-size="11" text-anchor="end" class="h">239</text><text x="207.4" y="32.2" font-size="11" text-anchor="end" class="h">94</text><text x="208.4" y="30" font-size="18" class="h">Pu</text></svg>