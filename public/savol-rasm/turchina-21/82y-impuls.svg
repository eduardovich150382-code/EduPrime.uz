n><tspan dy="-4"> </tspan>/(<tspan font-style="italic">m</tspan><tspan dy="4" font-size="11">He</tspan><tspan dy="-4"> </tspan> + <tspan font-style="italic">m</tspan><tspan dy="4" font-size="11">n</tspan><tspan dy="-4"> </tspan>) ≈ 0,82 MeV</text><text x="220" y="150" font-size="16" text-anchor="middle" font-weight="bold" class="h" style="fill:#2563EB"><tspan font-style="italic">E</tspan><tspan dy="4" font-size="11">n</tspan><tspan dy="-4"> </tspan> = <tspan font-style="italic">Q</tspan> − <tspan font-style="italic">E</tspan><tspan dy="4" font-size="11">He</tspan><tspan dy="-4"> </tspan> ≈ 2,45 MeV</text></svg>