<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200" font-family="Arial, Helvetica, sans-serif"><title>A va Z ning qator bo'yicha balansi</title><style>.h{paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round}text{fill:#111827}</style><defs><marker id="a334155" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#334155"/></marker></defs><rect width="440" height="200" fill="#fff"/><text x="220" y="35" font-size="14" text-anchor="middle" class="h" style="fill:#334155">Har α: ΔA = −4, ΔZ = −2;   har β⁻: ΔA = 0, ΔZ = +1</text><text x="74.9" y="97.5" font-size="16" text-anchor="end" class="h" style="fill:#DC2626">235</text><text x="74.9" y="113.1" font-size="16" text-anchor="end" class="h" style="fill:#DC2626">92</text><text x="75.9" y="110" font-size="26" class="h" style="fill:#DC2626">U</text><line x1="120" y1="102" x2="300" y2="102" stroke="#334155" stroke-width="3.5" stroke-linecap="round" marker-end="url(#a334155)"/><text x="210" y="90" font-size="16" text-anchor="middle" font-weight="bold" class="h" style="fill:#EA580C">7 α</text><text x="210" y="125" font-size="16" text-anchor="middle" font-weight="bold" class="h" style="fill:#2563EB">4 β⁻</text><text x="356.8" y="97.5" font-size="16" text-anchor="end" class="h" style="fill:#2563EB">207</text><text x="356.8" y="113.1" font-size="16" text-anchor="end" class="h" style="fill:#2563EB">82</text><text x="357.8" y="110" font-size="26" class="h" style="fill:#2563EB">Pb</text><text x="220" y="170" font-size="15" text-anchor="middle" font-weight="bold" class="h"><tspan font-style="italic">A</tspan>: 235 − 7·4 = 207;    <tspan font-style="italic">Z</tspan>: 82 + 7·2 − 4 = 92</text></svg>