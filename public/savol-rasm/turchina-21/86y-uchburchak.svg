<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" width="440" height="320" font-family="Arial, Helvetica, sans-serif"><title>Impulslar uchburchagi: proton impulsi ikki alfa-zarra impulslari yig'indisi</title><style>.h{paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round}text{fill:#111827}</style><defs><marker id="a2563EB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563EB"/></marker><marker id="aEA580C" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#EA580C"/></marker></defs><rect width="440" height="320" fill="#fff"/><line x1="170" y1="225" x2="200.4" y2="52.7" stroke="#2563EB" stroke-width="4" stroke-linecap="round" marker-end="url(#a2563EB)"/><text x="163.2" y="138.8" font-size="15" text-anchor="middle" font-weight="bold" class="h" style="fill:#2563EB"><tspan font-style="italic">p</tspan><tspan dy="4" font-size="11">α</tspan><tspan dy="-4"> </tspan></text><line x1="200.4" y1="52.7" x2="230.8" y2="225" stroke="#2563EB" stroke-width="4" stroke-linecap="round" marker-end="url(#a2563EB)"/><text x="237.6" y="138.8" font-size="15" text-anchor="middle" font-weight="bold" class="h" style="fill:#2563EB"><tspan font-style="italic">p</tspan><tspan dy="4" font-size="11">α</tspan><tspan dy="-4"> </tspan></text><line x1="170" y1="225" x2="230.8" y2="225" stroke="#EA580C" stroke-width="4.5" stroke-linecap="round" marker-end="url(#aEA580C)"/><text x="200.4" y="251" font-size="15" text-anchor="middle" font-weight="bold" class="h" style="fill:#EA580C"><tspan font-style="italic">p</tspan><tspan dy="4" font-size="11">p</tspan><tspan dy="-4"> </tspan> = 2<tspan font-style="italic">p</tspan><tspan dy="4" font-size="11">α</tspan><tspan dy="-4"> </tspan>cos(φ/2)</text><text x="222.4" y="82.7" font-size="14" font-weight="bold" class="h" style="fill:#16A34A">φ/2 = 80°</text><text x="220" y="280" font-size="15" text-anchor="middle" font-weight="bold" class="h">η = <tspan font-style="italic">E</tspan><tspan dy="4" font-size="11">p</tspan><tspan dy="-4"> </tspan>/<tspan font-style="italic">E</tspan><tspan dy="4" font-size="11">2α</tspan><tspan dy="-4"> </tspan> = 2(<tspan font-style="italic">m</tspan><tspan dy="4" font-size="11">α</tspan><tspan dy="-4"> </tspan>/<tspan font-style="italic">m</tspan><tspan dy="4" font-size="11">p</tspan><tspan dy="-4"> </tspan>)cos²(φ/2)</text><text x="220" y="308" font-size="15" text-anchor="middle" font-weight="bold" class="h" style="fill:#EA580C"><tspan font-style="italic">E</tspan><tspan dy="4" font-size="11">p</tspan><tspan dy="-4"> </tspan> = <tspan font-style="italic">Q</tspan>η/(1 − η)</text></svg>