>n</tspan><tspan dy="4" font-size="11">β</tspan><tspan dy="-4"> </tspan> = 11</text><text x="220" y="188" font-size="15" text-anchor="middle" font-weight="bold" class="h" style="fill:#EA580C"><tspan font-style="italic">A</tspan> = 237 − 4·7 = 209</text></svg>