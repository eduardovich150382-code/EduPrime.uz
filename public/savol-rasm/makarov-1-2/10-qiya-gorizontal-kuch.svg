<text x="70" y="40" font-size="20" fill="#111827" text-anchor="start"><tspan font-style="italic">α</tspan> = 30°,  <tspan font-style="italic">m</tspan> = 2 kg,  <tspan font-style="italic">μ</tspan> = 0,8</text>
