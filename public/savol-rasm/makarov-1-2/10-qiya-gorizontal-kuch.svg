<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" font-family="Arial, Helvetica, sans-serif"><title>Qiya tekislikdagi jismga tekislik va gorizont kesishish chizig'i bo'ylab kuch</title>
