<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" font-family="Arial, Helvetica, sans-serif"><title>Beshinchi sathdan ikkinchisiga o'tish, H-gamma</title><style>.h{paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round}text{fill:#111827}</style><rect width="420" height="300" fill="#fff"/><line x1="90" y1="250" x2="260" y2="250" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/><text x="82" y="255" font-size="15" text-anchor="end" class="h"><tspan font-style="italic">n</tspan> = 1</text><text x="268" y="255" font-size="15" class="h">−13,6 eV</text><line x1="90" y1="172.5" x2="260" y2="172.5" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/><text x="82" y="177.5" font-size="15" text-anchor="end" class="h"><tspan font-style="italic">n</tspan> = 2</text><text x="268" y="177.5" font-size="15" class="h">−3,40 eV</text><line x1="90" y1="127.1" x2="260" y2="127.1" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/><text x="82" y="132.1" font-size="15" text-anchor="end" class="h"><tspan font-style="italic">n</tspan> = 3</text><text x="268" y="132.1" font-size="15" class="h">−1,51 eV</text><line x1="90" y1="95" x2="260" y2="95" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/><text x="82" y="100" font-size="15" text-anchor="end" class="h"><tspan font-style="italic">n</tspan> = 4</text><text x="268" y="100" font-size="15" class="h">−0,85 eV</text><line x1="90" y1="70" x2="260" y2="70" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/><text x="82" y="75" font-size="15" text-anchor="end" class="h"><tspan font-style="italic">n</tspan> = 5</text><text x="268" y="75" font-size="15" class="h">−0,54 eV</text><line x1="90" y1="30" x2="260" y2="30" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 6"/><text x="82" y="35" font-size="15" text-anchor="end" class="h"><tspan font-style="italic">n</tspan> = ∞</text><text x="268" y="35" font-size="15" class="h">0</text><line x1="170" y1="70" x2="170" y2="162.9" stroke="#4F46E5" stroke-width="4.5" stroke-linecap="round"/><polygon points="170,172.5 163.4,160.5 176.6,160.5" fill="#4F46E5"/><text x="178" y="154.8" font-size="15" font-weight="bold" style="fill:#4F46E5" class="h">434 nm</text><text x="200" y="292" font-size="15" text-anchor="middle" font-weight="bold" style="fill:#059669" class="h"><tspan font-style="italic">λ</tspan> = <tspan font-style="italic">d</tspan> sin<tspan font-style="italic">φ</tspan> ≈ 434 nm</text></svg>