e="14" fill="#222" text-anchor="middle"><tspan>Yon iplar 2 tadan </tspan><tspan font-style="italic">X</tspan><tspan> ni tutadi: taranglik 2</tspan><tspan font-style="italic">G</tspan><tspan> ; </tspan><tspan font-style="italic">T</tspan><tspan dy="4.2" font-size="10">1</tspan><tspan dy="-4.2"> = </tspan><tspan font-style="italic">G</tspan></text><text x="200.0" y="236.0" font-size="14" fill="#222" text-anchor="middle"><tspan>x: 2</tspan><tspan font-style="italic">G</tspan><tspan>cosα = 2</tspan><tspan font-style="italic">G</tspan><tspan>cosθ ⇒ α = θ</tspan></text><text x="200.0" y="258.0" font-size="14" fill="#222" text-anchor="middle"><tspan>y: 4</tspan><tspan font-style="italic">G</tspan><tspan>sinα = </tspan><tspan font-style="italic">G</tspan><tspan> ⇒ sinα = 1/4 ⇒ α ≈ 14,5°</tspan></text><text x="200.0" y="282.0" font-size="14" fill="#222" text-anchor="middle"><tspan>β = 180° − 2α ≈ 151° > 120°</tspan></text></svg>