<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" font-family="Arial, Helvetica, sans-serif"><title>Elektron va proton uchun tinchlik va kinetik energiyalar</title><defs><style>.h{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style></defs><rect width="500" height="240" fill="#fff"/><rect x="8" y="8" width="484" height="224" rx="14" fill="#eff6ff"/><text x="30" y="48" font-size="18" fill="#334155" text-anchor="start" font-weight="bold" class="h"><tspan>Elektron:</tspan></text><rect x="30" y="60" width="36" height="34" rx="4" fill="#2563eb" stroke="#fff" stroke-width="2"/><rect x="66" y="60" width="354" height="34" rx="4" fill="#f97316" stroke="#fff" stroke-width="2"/><text x="48" y="118" font-size="15" fill="#2563eb" text-anchor="start" class="h"><tspan font-style="italic">E</tspan><tspan dy="4.5" font-size="10.2">0</tspan><tspan dy="-4.5"> = 0,511 MeV</tspan></text><text x="243" y="84" font-size="17" fill="#fff" text-anchor="middle"><tspan font-style="italic">E</tspan><tspan dy="5.1" font-size="11.6">k</tspan><tspan dy="-5.1"> = 5 MeV</tspan></text><text x="30" y="160" font-size="18" fill="#334155" text-anchor="start" font-weight="bold" class="h"><tspan>Proton:</tspan></text><rect x="30" y="172" width="388" height="34" rx="4" fill="#2563eb" stroke="#fff" stroke-width="2"/><rect x="418" y="172" width="4" height="34" rx="0" fill="#f97316" stroke="#f97316" stroke-width="1"/><text x="224" y="196" font-size="17" fill="#fff" text-anchor="middle"><tspan font-style="italic">E</tspan><tspan dy="5.1" font-size="11.6">0</tspan><tspan dy="-5.1"> = 938 MeV</tspan></text><text x="430" y="196" font-size="16" fill="#f97316" text-anchor="start" class="h"><tspan font-style="italic">E</tspan><tspan dy="4.8" font-size="10.9">k</tspan></text></svg>