<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" font-family="Arial, Helvetica, sans-serif"><title>Yerdagi va raketadagi vaqtlar</title><defs><style>.h{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style></defs><rect width="480" height="220" fill="#fff"/><rect x="8" y="8" width="464" height="204" rx="14" fill="#eff6ff"/><text x="30" y="60" font-size="18" fill="#334155" text-anchor="start" font-weight="bold" class="h"><tspan>Yer soati:</tspan></text><rect x="30" y="72" width="400" height="34" rx="5" fill="#2563eb" stroke="#fff" stroke-width="2"/><text x="230" y="96" font-size="18" fill="#fff" text-anchor="middle"><tspan font-style="italic">t</tspan><tspan dy="5.4" font-size="12.2">1</tspan><tspan dy="-5.4"> = 25 yil</tspan></text><text x="30" y="145" font-size="18" fill="#334155" text-anchor="start" font-weight="bold" class="h"><tspan>Raketa soati:</tspan></text><rect x="30" y="157" width="112" height="34" rx="5" fill="#f97316" stroke="#fff" stroke-width="2"/><text x="150" y="181" font-size="18" fill="#f97316" text-anchor="start" class="h"><tspan font-style="italic">t</tspan><tspan dy="5.4" font-size="12.2">2</tspan><tspan dy="-5.4"> = 7 yil</tspan></text></svg>