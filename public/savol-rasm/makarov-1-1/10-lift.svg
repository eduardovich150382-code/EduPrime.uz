<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ar" viewBox="0 0 10 10" markerWidth="4" markerHeight="4" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="dm" viewBox="0 0 10 10" markerWidth="5" markerHeight="5" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#374151"/></marker></defs>
<rect width="560" height="440" fill="#fff"/>
<line x1="200" y1="0" x2="200" y2="50" stroke="#1f2937" stroke-width="5"/>
<!-- cabin -->
<rect x="80" y="50" width="240" height="340" rx="6" fill="#e0f2fe" stroke="#0c4a6e" stroke-width="5"/>
<rect x="80" y="50" width="240" height="16" fill="#38bdf8" stroke="#0c4a6e" stroke-width="4"/>
<rect x="80" y="374" width="240" height="16" fill="#38bdf8" stroke="#0c4a6e" stroke-width="4"/>
<!-- ball -->
<line x1="190" y1="340" x2="190" y2="80" stroke="#f97316" stroke-width="3" stroke-dasharray="8 6"/>
<circle cx="190" cy="340" r="13" fill="#ef4444" stroke="#7f1d1d" stroke-width="3.5"/>
<line x1="150" y1="335" x2="150" y2="265" stroke="#ef4444" stroke-width="4.5" marker-end="url(#ar)"/>
<text x="104" y="300" font-size="22" font-weight="bold" fill="#b91c1c"><tspan font-style="italic">v</tspan>₀</text>
<!-- h -->
<line x1="260" y1="340" x2="260" y2="374" stroke="#374151" stroke-width="3" marker-start="url(#dm)" marker-end="url(#dm)"/>
<line x1="203" y1="340" x2="275" y2="340" stroke="#374151" stroke-width="2" stroke-dasharray="5 5"/>
<text x="212" y="330" font-size="18" fill="#111827"><tspan font-style="italic">h</tspan> = 0,3 m</text>
<!-- H -->
<line x1="365" y1="66" x2="365" y2="374" stroke="#374151" stroke-width="3" marker-start="url(#dm)" marker-end="url(#dm)"/>
<line x1="320" y1="66" x2="380" y2="66" stroke="#374151" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="320" y1="374" x2="380" y2="374" stroke="#374151" stroke-width="2" stroke-dasharray="5 5"/>
<text x="374" y="210" font-size="22" fill="#111827"><tspan font-style="italic">H</tspan> = 2,8 m</text>
<!-- acceleration -->
<line x1="500" y1="120" x2="500" y2="230" stroke="#16a34a" stroke-width="5" marker-end="url(#ar)"/>
<text x="514" y="180" font-size="24" font-weight="bold" font-style="italic" fill="#15803d">a</text>
</svg>
