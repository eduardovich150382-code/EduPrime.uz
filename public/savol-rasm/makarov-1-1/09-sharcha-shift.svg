<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ar" viewBox="0 0 10 10" markerWidth="4" markerHeight="4" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="dm" viewBox="0 0 10 10" markerWidth="5" markerHeight="5" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#374151"/></marker></defs>
<rect width="520" height="420" fill="#fff"/>
<!-- ceiling -->
<rect x="40" y="30" width="440" height="22" fill="#cbd5e1" stroke="#334155" stroke-width="4"/>
<g stroke="#64748b" stroke-width="2.5"><line x1="60" y1="30" x2="75" y2="52"/><line x1="120" y1="30" x2="135" y2="52"/><line x1="180" y1="30" x2="195" y2="52"/><line x1="240" y1="30" x2="255" y2="52"/><line x1="300" y1="30" x2="315" y2="52"/><line x1="360" y1="30" x2="375" y2="52"/><line x1="420" y1="30" x2="435" y2="52"/></g>
<text x="60" y="22" font-size="17" fill="#334155">shift</text>
<!-- floor -->
<rect x="40" y="370" width="440" height="24" fill="#d97706" stroke="#78350f" stroke-width="4"/>
<text x="60" y="414" font-size="17" fill="#78350f">pol</text>
<!-- trajectory -->
<line x1="200" y1="56" x2="200" y2="270" stroke="#f97316" stroke-width="3" stroke-dasharray="8 6"/>
<line x1="240" y1="56" x2="240" y2="366" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 6"/>
<path d="M200,64 Q220,40 240,64" fill="none" stroke="#7c3aed" stroke-width="3"/>
<path d="M230,342 l10,18 l10,-18 z" fill="#7c3aed" stroke="#7c3aed" stroke-width="3.5"/>
<!-- ball -->
<circle cx="200" cy="282" r="14" fill="#ef4444" stroke="#7f1d1d" stroke-width="3.5"/>
<line x1="170" y1="270" x2="170" y2="200" stroke="#ef4444" stroke-width="4.5" marker-end="url(#ar)"/>
<text x="120" y="240" font-size="22" font-weight="bold" fill="#b91c1c"><tspan font-style="italic">v</tspan>₀</text>
<line x1="186" y1="282" x2="110" y2="282" stroke="#374151" stroke-width="2" stroke-dasharray="5 5"/>
<!-- dimension h -->
<line x1="320" y1="52" x2="320" y2="282" stroke="#374151" stroke-width="3" marker-start="url(#dm)" marker-end="url(#dm)"/>
<line x1="214" y1="282" x2="340" y2="282" stroke="#374151" stroke-width="2" stroke-dasharray="5 5"/>
<text x="330" y="175" font-size="22" fill="#111827"><tspan font-style="italic">h</tspan> = 1,35 m</text>
<!-- dimension H -->
<line x1="450" y1="52" x2="450" y2="370" stroke="#374151" stroke-width="3" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="340" y="335" font-size="22" fill="#111827"><tspan font-style="italic">H</tspan> = 2 m</text>
</svg>
