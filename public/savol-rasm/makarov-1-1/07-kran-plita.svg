<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ar" viewBox="0 0 10 10" markerWidth="4" markerHeight="4" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="dm" viewBox="0 0 10 10" markerWidth="5" markerHeight="5" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#374151"/></marker></defs>
<rect width="560" height="420" fill="#fff"/>
<!-- ground -->
<rect x="20" y="360" width="520" height="40" fill="#b45309" stroke="#78350f" stroke-width="3"/>
<rect x="20" y="352" width="520" height="10" fill="#65a30d"/>
<!-- cables -->
<line x1="230" y1="10" x2="230" y2="60" stroke="#1f2937" stroke-width="4"/>
<path d="M222,60 h16 v14 q0,14 -10,14" fill="none" stroke="#f59e0b" stroke-width="5"/>
<line x1="228" y1="88" x2="150" y2="140" stroke="#1f2937" stroke-width="3.5"/>
<line x1="228" y1="88" x2="310" y2="140" stroke="#1f2937" stroke-width="3.5"/>
<!-- plate -->
<rect x="130" y="140" width="200" height="26" rx="3" fill="#9ca3af" stroke="#374151" stroke-width="4"/>
<g fill="#6b7280"><circle cx="160" cy="153" r="2.5"/><circle cx="200" cy="149" r="2"/><circle cx="250" cy="157" r="2.5"/><circle cx="295" cy="150" r="2"/></g>
<!-- plate velocity -->
<line x1="100" y1="130" x2="100" y2="200" stroke="#2563eb" stroke-width="4" marker-end="url(#ar)"/>
<text x="62" y="172" font-size="22" font-style="italic" fill="#2563eb" font-weight="bold">v</text>
<!-- stone -->
<path d="M318,166 l14,-4 l10,8 l-3,12 l-14,3 l-9,-9 z" fill="#78716c" stroke="#292524" stroke-width="3" transform="translate(30,40)"/>
<line x1="363" y1="226" x2="363" y2="300" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6"/>
<path d="M353,292 l10,18 l10,-18 z" fill="#dc2626" stroke="#dc2626" stroke-width="3.5"/>
<text x="382" y="230" font-size="18" fill="#b91c1c">tosh</text>
<!-- dimension h -->
<line x1="440" y1="166" x2="440" y2="352" stroke="#374151" stroke-width="3" marker-start="url(#dm)" marker-end="url(#dm)"/>
<line x1="335" y1="166" x2="460" y2="166" stroke="#374151" stroke-width="2" stroke-dasharray="5 5"/>
<text x="452" y="266" font-size="22" fill="#111827"><tspan font-style="italic">h</tspan> = 6 m</text>
</svg>
