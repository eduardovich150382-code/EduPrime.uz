<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="460" height="360" font-family="Arial, Helvetica, sans-serif"><title>Aravacha sanoq sistemasidagi erkin tushish tezlanishi</title>
<rect width="460" height="360" fill="#fff"/>
<line x1="120" y1="50" x2="120" y2="296" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round"/>
<polygon points="120,310 127,296 113,296" fill="#16a34a" stroke="#16a34a" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="106" y="200" font-size="22" fill="#16a34a" text-anchor="end"><tspan font-style="italic">g</tspan></text>
<line x1="120" y1="50" x2="225.6" y2="232.9" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round"/>
<polygon points="232.6,245 231.6,229.4 219.5,236.4" fill="#dc2626" stroke="#dc2626" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="162.6" y="155" font-size="22" fill="#dc2626" text-anchor="middle"><tspan font-style="italic">a</tspan></text>
<line x1="232.6" y1="245" x2="132.1" y2="303" stroke="#1e3a8a" stroke-width="4.5" stroke-linecap="round"/>
<polygon points="120,310 135.6,309.1 128.6,296.9" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="198.3" y="299.5" font-size="22" fill="#1e3a8a" text-anchor="middle"><tspan font-style="italic">g</tspan>′</text>
<path d="M120,254 A56,56 0 0 1 148,261.5" stroke="#1e293b" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="138" y="246" font-size="19" fill="#111827" text-anchor="middle"><tspan font-style="italic">α</tspan></text>
<text x="330" y="330" font-size="18" fill="#111827" text-anchor="middle"><tspan font-style="italic">g</tspan> = <tspan font-style="italic">g</tspan>′ + <tspan font-style="italic">a</tspan>,  <tspan font-style="italic">a</tspan> = <tspan font-style="italic">g</tspan> sin <tspan font-style="italic">α</tspan></text>
