<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" width="360" height="230" font-family="Arial, Helvetica, sans-serif"><title>Dielektrikli ikki kondensator</title><style>.h{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style><defs><pattern id="dh" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#DBEAFE"/><line x1="0" y1="0" x2="0" y2="10" stroke="#3B82F6" stroke-width="3"/></pattern></defs><rect width="360" height="230" fill="#fff"/><rect x="80" y="115" width="50" height="75" rx="0" fill="url(#dh)" stroke="none" stroke-width="0"/><line x1="78" y1="40" x2="78" y2="190" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/><line x1="132" y1="40" x2="132" y2="190" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/><text x="105" y="220" font-size="20" fill="#111827" text-anchor="middle" class="h"><tspan>1</tspan></text><rect x="230" y="40" width="50" height="150" rx="0" fill="url(#dh)" stroke="none" stroke-width="0"/><line x1="228" y1="40" x2="228" y2="190" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/><line x1="282" y1="40" x2="282" y2="190" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/><text x="255" y="220" font-size="20" fill="#111827" text-anchor="middle" class="h"><tspan>2</tspan></text><text x="180" y="30" font-size="20" fill="#7C3AED" text-anchor="middle" class="h"><tspan>ε = 4</tspan></text></svg>