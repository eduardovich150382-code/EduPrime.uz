<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220" font-family="Arial, Helvetica, sans-serif"><title>Sim bilan ulangan sharlar</title><style>.h{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style><rect width="420" height="220" fill="#fff"/><circle cx="90" cy="110" r="40" fill="#FEE2E2" stroke="#DC2626" stroke-width="3.5"/><circle cx="310" cy="110" r="80" fill="#DBEAFE" stroke="#2563EB" stroke-width="3.5"/><path d="M130 110 C 170 60, 200 160, 230 110" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/><text x="90" y="116" font-size="20" fill="#111827" text-anchor="middle" class="h"><tspan font-style="italic">q</tspan><tspan dy="6" font-size="13">1</tspan><tspan dy="-6">&#8202;</tspan></text><text x="310" y="116" font-size="22" fill="#111827" text-anchor="middle" class="h"><tspan font-style="italic">q</tspan><tspan dy="6.6" font-size="14">2</tspan><tspan dy="-6.6">&#8202;</tspan></text><text x="90" y="180" font-size="18" fill="#DC2626" text-anchor="middle" class="h"><tspan font-style="italic">r</tspan><tspan dy="5.4" font-size="12">1</tspan><tspan dy="-5.4"> = 4 sm</tspan></text><text x="310" y="214" font-size="18" fill="#2563EB" text-anchor="middle" class="h"><tspan font-style="italic">r</tspan><tspan dy="5.4" font-size="12">2</tspan><tspan dy="-5.4"> = 12 sm</tspan></text><text x="180" y="50" font-size="18" fill="#334155" text-anchor="middle" class="h"><tspan>sim</tspan></text></svg>