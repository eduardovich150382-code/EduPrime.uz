<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350"><title>Ichki bo‘shliq = tashqi hajm − material hajmi</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#dc3749"/></marker></defs><rect width="760" height="350" rx="16" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172b43" font-size="19"><text x="28" y="36" font-size="23" font-weight="bold">Ichki bo‘shliq = tashqi hajm − material hajmi</text><rect x="95" y="85" width="130" height="130" rx="3" fill="#efc5df" stroke="#345772" stroke-width="2"/><rect x="131" y="121" width="58" height="58" rx="3" fill="#fff" stroke="#345772" stroke-width="2"/><circle cx="510" cy="150" r="68" fill="#dcecc3" stroke="#345772" stroke-width="2"/><circle cx="510" cy="150" r="33" fill="#fff" stroke="#345772" stroke-width="2"/><text x="70" y="256" font-size="19" fill="#172b43">K: tashqi hajm 8 sm³</text><text x="70" y="289" font-size="19" fill="#172b43">Material: 20/4 = 5 sm³</text><text x="70" y="321" font-size="21" fill="#172b43">Bo‘shliq: 8 − 5 = 3 sm³</text><text x="398" y="256" font-size="19" fill="#172b43">L: tashqi hajm 4 sm³</text><text x="398" y="289" font-size="19" fill="#172b43">Material: 10/4 = 2,5 sm³</text><text x="398" y="321" font-size="21" fill="#172b43">Bo‘shliq: 1,5 sm³</text></g></svg>