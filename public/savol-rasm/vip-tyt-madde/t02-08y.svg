<svg xmlns="http://www.w3.org/2000/svg" width="760" height="345" viewBox="0 0 760 345"><title>Massa hajmga, nisbiy bardoshlilik 1/h ga bog‘liq</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#dc3749"/></marker></defs><rect width="760" height="345" rx="16" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172b43" font-size="19"><text x="28" y="36" font-size="23" font-weight="bold">Massa hajmga, nisbiy bardoshlilik 1/h ga bog‘liq</text><rect x="90" y="127" width="95" height="80" rx="3" fill="#b4e1f5" stroke="#345772" stroke-width="2"/><text x="122" y="237" font-size="22" fill="#172b43">X</text><text x="85" y="274" font-size="19" fill="#172b43">V = 2Ah</text><text x="85" y="309" font-size="19" fill="#172b43">D ∼ 1/(2h)</text><rect x="310" y="167" width="95" height="40" rx="3" fill="#b4e1f5" stroke="#345772" stroke-width="2"/><text x="342" y="237" font-size="22" fill="#172b43">Y</text><text x="305" y="274" font-size="19" fill="#172b43">V = 2Ah</text><text x="305" y="309" font-size="19" fill="#172b43">D ∼ 1/h</text><rect x="530" y="87" width="95" height="120" rx="3" fill="#b4e1f5" stroke="#345772" stroke-width="2"/><text x="562" y="237" font-size="22" fill="#172b43">Z</text><text x="525" y="274" font-size="19" fill="#172b43">V = 9Ah</text><text x="525" y="309" font-size="19" fill="#172b43">D ∼ 1/(3h)</text><text x="71" y="74" font-size="21" fill="#172b43">Massa: Z &gt; X = Y</text><text x="370" y="74" font-size="21" fill="#172b43">Bardoshlilik: Y &gt; X &gt; Z</text></g></svg>