<svg xmlns="http://www.w3.org/2000/svg" width="760" height="285" viewBox="0 0 760 285"><title>Qatlamning hajmi ikki shkala belgisi ayirmasidir</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#dc3749"/></marker></defs><rect width="760" height="285" rx="16" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172b43" font-size="19"><text x="28" y="36" font-size="23" font-weight="bold">Qatlamning hajmi ikki shkala belgisi ayirmasidir</text><rect x="80" y="80" width="190" height="45" rx="3" fill="#b8e6f5" stroke="#345772" stroke-width="2"/><rect x="80" y="125" width="190" height="40" rx="3" fill="#d6ecb2" stroke="#345772" stroke-width="2"/><rect x="80" y="165" width="190" height="30" rx="3" fill="#efc5df" stroke="#345772" stroke-width="2"/><text x="108" y="108" font-size="19" fill="#172b43">Z: 45 sm³</text><text x="108" y="152" font-size="19" fill="#172b43">Y: 20 sm³</text><text x="108" y="187" font-size="19" fill="#172b43">X: 10 sm³</text><text x="323" y="106" font-size="22" fill="#172b43">Teng massa → V = m / ρ</text><text x="323" y="148" font-size="19" fill="#172b43">Zichroq X pastda turadi</text><text x="323" y="189" font-size="19" fill="#172b43">10 : 20 : 45 = 2 : 4 : 9</text><text x="76" y="245" font-size="20" fill="#172b43">Shkaladagi 30 — Y hajmi emas: 30 − 10 = 20 sm³</text></g></svg>