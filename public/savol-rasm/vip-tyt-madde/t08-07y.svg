<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"><title>Botgan hajm = dastlabki bo‘sh hajm + to‘kilgan suv</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#dc3749"/></marker></defs><rect width="760" height="330" rx="16" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172b43" font-size="19"><text x="28" y="36" font-size="23" font-weight="bold">Botgan hajm = dastlabki bo‘sh hajm + to‘kilgan suv</text><rect x="70" y="80" width="220" height="170" rx="3" fill="#c5e7ef" stroke="#345772" stroke-width="2"/><path d="M70 110L290 110" fill="none" stroke="#dc3749" stroke-width="3"/><circle cx="180" cy="110" r="46" fill="#ffce79" stroke="#345772" stroke-width="2"/><path d="M335 110L423 110" fill="none" stroke="#dc3749" stroke-width="3" marker-end="url(#a)"/><text x="410" y="91" font-size="19" fill="#172b43">4 sm³ bo‘sh joy to‘ldi</text><text x="410" y="130" font-size="19" fill="#172b43">12 sm³ suv to‘kildi</text><text x="410" y="175" font-size="19" fill="#172b43">Botgan hajm = 16 sm³</text><text x="410" y="216" font-size="19" fill="#172b43">Shar hajmi = 32 sm³</text><text x="73" y="293" font-size="22" fill="#172b43">m(shar) = 16 g; m(to‘kilgan) = 12 g; ΔM = +4 g</text></g></svg>