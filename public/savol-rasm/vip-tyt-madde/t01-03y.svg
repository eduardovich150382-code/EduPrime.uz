<svg xmlns="http://www.w3.org/2000/svg" width="760" height="345" viewBox="0 0 760 345"><title>Parallelepiped va shar hajmini farqlaymiz</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#dc3749"/></marker></defs><rect width="760" height="345" rx="16" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172b43" font-size="19"><text x="28" y="36" font-size="23" font-weight="bold">Parallelepiped va shar hajmini farqlaymiz</text><rect x="60" y="94" width="240" height="120" rx="3" fill="#d6e4f2" stroke="#345772" stroke-width="2"/><path d="M60 94L104 65" fill="none" stroke="#345772" stroke-width="3"/><path d="M300 94L344 65" fill="none" stroke="#345772" stroke-width="3"/><path d="M104 65L344 65" fill="none" stroke="#345772" stroke-width="3"/><path d="M344 65L344 185" fill="none" stroke="#345772" stroke-width="3"/><path d="M300 214L344 185" fill="none" stroke="#345772" stroke-width="3"/><text x="105" y="240" font-size="19" fill="#172b43">10 sm</text><text x="308" y="160" font-size="16" fill="#172b43">5 sm</text><text x="317" y="216" font-size="16" fill="#172b43">4 sm</text><text x="84" y="277" font-size="19" fill="#172b43">V = 10 × 5 × 4 = 200 sm³</text><circle cx="560" cy="155" r="81" fill="#e1f0ae" stroke="#345772" stroke-width="2"/><path d="M560 155L641 155" fill="none" stroke="#dc3749" stroke-width="3"/><text x="578" y="145" font-size="16" fill="#172b43">r = 5 sm</text><text x="439" y="277" font-size="19" fill="#172b43">V = 4πr³/3 = 500 sm³</text><text x="240" y="314" font-size="21" fill="#172b43">V(K) / V(L) = 200 / 500 = 2 / 5</text></g></svg>