<svg xmlns="http://www.w3.org/2000/svg" width="760" height="355" viewBox="0 0 760 355"><title>Teng hajmlar, turli massalar</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#dc3749"/></marker></defs><rect width="760" height="355" rx="16" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172b43" font-size="19"><text x="28" y="36" font-size="23" font-weight="bold">Teng hajmlar, turli massalar</text><rect x="70" y="80" width="180" height="148" rx="3" fill="#f1f6fa" stroke="#345772" stroke-width="2"/><rect x="70" y="154" width="180" height="74" rx="3" fill="#a9dff7" stroke="#345772" stroke-width="2"/><path d="M70 154L250 154" fill="none" stroke="#dc3749" stroke-width="3"/><text x="80" y="113" font-size="19" fill="#172b43">60 sm³</text><text x="90" y="254" font-size="19" fill="#172b43">Suv</text><rect x="370" y="80" width="180" height="148" rx="3" fill="#f1f6fa" stroke="#345772" stroke-width="2"/><rect x="370" y="154" width="180" height="74" rx="3" fill="#efc0df" stroke="#345772" stroke-width="2"/><path d="M370 154L550 154" fill="none" stroke="#dc3749" stroke-width="3"/><text x="380" y="113" font-size="19" fill="#172b43">60 sm³</text><text x="390" y="254" font-size="19" fill="#172b43">X suyuqlik</text><text x="57" y="290" font-size="19" fill="#172b43">m = 140 − 80 = 60 g</text><text x="367" y="290" font-size="19" fill="#172b43">m = 170 − 140 = 30 g</text><text x="220" y="327" font-size="23" fill="#172b43">ρ(X) = 30 / 60 = 0,5 g/sm³</text></g></svg>