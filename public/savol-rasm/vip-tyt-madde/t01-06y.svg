<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"><title>Eritmasdan, to‘g‘ri qatorlab kesish</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#dc3749"/></marker></defs><rect width="760" height="340" rx="16" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172b43" font-size="19"><text x="28" y="36" font-size="23" font-weight="bold">Eritmasdan, to‘g‘ri qatorlab kesish</text><rect x="48" y="63" width="216" height="216" rx="3" fill="#f3f7fb" stroke="#345772" stroke-width="2"/><circle cx="84" cy="99" r="34" fill="#cde9f7" stroke="#345772" stroke-width="2"/><circle cx="84" cy="171" r="34" fill="#cde9f7" stroke="#345772" stroke-width="2"/><circle cx="84" cy="243" r="34" fill="#cde9f7" stroke="#345772" stroke-width="2"/><circle cx="156" cy="99" r="34" fill="#cde9f7" stroke="#345772" stroke-width="2"/><circle cx="156" cy="171" r="34" fill="#cde9f7" stroke="#345772" stroke-width="2"/><circle cx="156" cy="243" r="34" fill="#cde9f7" stroke="#345772" stroke-width="2"/><circle cx="228" cy="99" r="34" fill="#cde9f7" stroke="#345772" stroke-width="2"/><circle cx="228" cy="171" r="34" fill="#cde9f7" stroke="#345772" stroke-width="2"/><circle cx="228" cy="243" r="34" fill="#cde9f7" stroke="#345772" stroke-width="2"/><text x="58" y="305" font-size="18" fill="#172b43">12 sm × 12 sm qatlam</text><text x="324" y="100" font-size="22" fill="#172b43">Diametr: 2r = 4 sm</text><text x="324" y="142" font-size="21" fill="#172b43">Har qatlam: 3 × 3 = 9 ta</text><text x="324" y="184" font-size="21" fill="#172b43">Balandlik: 8 / 4 = 2 qatlam</text><text x="324" y="239" font-size="25" fill="#196a58">Jami: 9 × 2 = 18 ta</text></g></svg>